# Ban an IP at the firewall for 1 hour after 20 security events in 10 minutes.
[kidsway]
enabled  = true
filter   = kidsway
logpath  = /opt/kidsway/deploy/logs/security.log
maxretry = 20
findtime = 10m
bantime  = 1h
# Docker traffic does not pass the INPUT chain, so ban in DOCKER-USER as well.
action   = iptables-multiport[name=kidsway, port="80,443", protocol=tcp, chain=DOCKER-USER]

[sshd]
enabled  = true
maxretry = 5
bantime  = 1h
