# Matches the API's security log lines, for example:
# 2026-11-01T16:20:02.453Z kidsway_security event=auth_fail ip=203.0.113.7 reason=otp_wrong attempts=2
[Definition]
failregex = ^\S+ kidsway_security event=(auth_fail|handover_fail|rate_limited|signed_url_rejected|access_denied) ip=<HOST>(\s|$)
ignoreregex =
datepattern = ^%%Y-%%m-%%dT%%H:%%M:%%S
