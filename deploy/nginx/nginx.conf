# KidsWay reverse proxy: TLS termination, rate limits, request filtering.
worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;                         # do not reveal the nginx version
  sendfile on;
  keepalive_timeout 15s;
  client_body_timeout 10s;                   # slow-request protection
  client_header_timeout 10s;
  send_timeout 10s;
  client_max_body_size 3m;                   # photo reports are at most 2 MB (hiring documents get 5m below)

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent rt=$request_time';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # Rate-limit zones (per client IP), in front of the app's own limits
  limit_req_zone $binary_remote_addr zone=api:10m  rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=apply:10m rate=20r/m;   # job applications and their uploads
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;
  limit_conn_status 429;

  upstream kidsway_api { server api:3000; keepalive 16; }

  # Port 80 only redirects to HTTPS
  server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/kidsway.crt;
    ssl_certificate_key /etc/nginx/certs/kidsway.key;
    ssl_protocols TLSv1.2 TLSv1.3;           # no SSLv3, TLS 1.0 or 1.1
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn perip 30;

    # Only these paths exist. Everything else is dropped before it reaches the app.
    location = /healthz { proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }

    location /api/auth/ {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }

    # Public job applications: the SMS step shares the strict auth zone, the rest gets its own zone.
    location /api/careers/otp/ {
      limit_req zone=auth burst=5 nodelay;
      limit_except POST { deny all; }
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }
    location /api/careers/ {
      limit_req zone=apply burst=10 nodelay;
      client_max_body_size 5m;               # MyKad photos and certificates, up to 3 MB each
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }
    location ~ ^/api/admin/applicants/[A-Za-z0-9_-]+/docs$ {
      limit_req zone=api burst=5 nodelay;
      client_max_body_size 5m;
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }

    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }

    location /media/docs/ {
      limit_req zone=api burst=10 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }

    location /media/photos/ {
      limit_req zone=api burst=10 nodelay;
      limit_except GET { deny all; }
      proxy_pass http://kidsway_api;
      include /etc/nginx/proxy_common.conf;
    }

    # The web app: one page, its static files, the PWA manifest and service worker
    location = / { proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }
    location /static/ { limit_except GET { deny all; } proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }
    location = /manifest.webmanifest { limit_except GET { deny all; } proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }
    location = /careers { limit_except GET { deny all; } proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }
    location = /sw.js { limit_except GET { deny all; } proxy_pass http://kidsway_api; include /etc/nginx/proxy_common.conf; }

    location / { return 404; }
  }
}
